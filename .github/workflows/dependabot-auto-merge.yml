name: Dependabot auto-merge
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  auto-merge:
    name: Enable auto-merge
    # The PR author, not github.actor, which is whoever last pushed or re-ran
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch update metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Majors need a human. Auto-merge still waits for every required check and review.
      # A merge made with GITHUB_TOKEN doesn't trigger push workflows, so the Build and SonarQube
      # runs on main are skipped unless the DEPENDABOT_AUTOMERGE_TOKEN Dependabot secret is set.
      # --required keeps this job's own "Enable auto-merge" check out of the watch set;
      # watching all checks would deadlock on itself until the job timeout
      - name: Wait for checks to pass
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GITHUB_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr checks "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --required --watch --interval 10

      - name: Approve PR
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GITHUB_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN || github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr review --approve "$PR_URL"

      - name: Enable auto-merge for patch and minor updates
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GITHUB_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN || github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"
