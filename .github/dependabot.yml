version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week before proposing a new release, so a compromised or broken publish is usually
    # caught and pulled first. Security updates ignore the cooldown.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    # A dependency joins the first group it matches, so specific groups come before catch-alls
    groups:
      # All security fixes in one PR, instead of one PR per vulnerable package
      security:
        applies-to: security-updates
        patterns:
          - "*"

      # Angular packages pin each other as exact peers, so they must move together.
      # @analogjs/vite-plugin-angular peers on @angular/build and has to track it.
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@analogjs/*"
        update-types:
          - "minor"
          - "patch"
      # Majors kept separate: they need `ng update` migrations and shouldn't block patch releases
      angular-major:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@analogjs/*"
        update-types:
          - "major"

      # wrangler peers on a matching @cloudflare/workers-types major
      cloudflare:
        patterns:
          - "wrangler"
          - "@cloudflare/*"

      # @vitest/* packages must match the vitest version
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"

      # angular-eslint and typescript-eslint peer on each other and on eslint
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "angular-eslint"
          - "typescript-eslint"

      # Everything else that's low-risk in one weekly PR; other majors still arrive individually
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Angular's compiler pins TypeScript to a single minor (22.x: >=6.0 <6.1), so anything past a
      # TypeScript patch has to land alongside an Angular upgrade that supports it (via ng update)
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
